<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="296" viewBox="0 0 1440 296" role="img" aria-labelledby="workflow-title workflow-desc" xml:lang="zh-CN">
<title id="workflow-title">InclusionMed · 贡献流程</title>
<desc id="workflow-desc">提交 Discussion；组织方初审；材料与复现；返修复审；收录发布. 贡献者与组织方的分工。初审、复审编号为灰金色，最终收录编号为亮金色。</desc>
<rect x="0.75" y="0.75" width="1438.5" height="294.5" rx="18" fill="#f3f1e8" stroke="#d9ded2" stroke-width="1.5"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="28" y="32" text-anchor="start" font-size="17" font-weight="650" fill="#37665a">InclusionMed</text>
<path d="M294 80 H476 m-7 -5 7 5 -7 5" fill="none" stroke="#91a58e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="258" cy="80" r="24" fill="#37665a"/>
<text x="258" y="87" text-anchor="middle" font-size="19" font-weight="650" fill="#ffffff">01</text>
<text x="258" y="133" text-anchor="middle" font-size="23" font-weight="650" fill="#203e3b">提交 Discussion</text>
<path d="M548 80 H730 m-7 -5 7 5 -7 5" fill="none" stroke="#91a58e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="512" cy="80" r="24" fill="#72674e"/>
<text x="512" y="87" text-anchor="middle" font-size="19" font-weight="650" fill="#ffffff">02</text>
<text x="512" y="133" text-anchor="middle" font-size="23" font-weight="650" fill="#203e3b">组织方初审</text>
<path d="M802 80 H984 m-7 -5 7 5 -7 5" fill="none" stroke="#91a58e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="766" cy="80" r="24" fill="#537764"/>
<text x="766" y="87" text-anchor="middle" font-size="19" font-weight="650" fill="#ffffff">03</text>
<text x="766" y="133" text-anchor="middle" font-size="23" font-weight="650" fill="#203e3b">材料与复现</text>
<path d="M1056 80 H1238 m-7 -5 7 5 -7 5" fill="none" stroke="#91a58e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1020" cy="80" r="24" fill="#72674e"/>
<text x="1020" y="87" text-anchor="middle" font-size="19" font-weight="650" fill="#ffffff">04</text>
<text x="1020" y="133" text-anchor="middle" font-size="23" font-weight="650" fill="#203e3b">返修复审</text>
<circle cx="1274" cy="80" r="24" fill="#d6ae4b"/>
<text x="1274" y="87" text-anchor="middle" font-size="19" font-weight="650" fill="#3f3520">05</text>
<text x="1274" y="133" text-anchor="middle" font-size="23" font-weight="650" fill="#203e3b">收录发布</text>
<rect x="16" y="157" width="1408" height="55" rx="10" fill="#e4ebe1"/>
<rect x="16" y="220" width="1408" height="55" rx="10" fill="#ebe8dc"/>
<text x="38" y="191" text-anchor="start" font-size="16" font-weight="700" fill="#37665a">贡献者</text>
<text x="38" y="254" text-anchor="start" font-size="16" font-weight="700" fill="#72674e">组织方</text>
<text x="258" y="191" text-anchor="middle" font-size="19" font-weight="550" fill="#37665a">提案与公开示例</text>
<text x="258" y="254" text-anchor="middle" font-size="19" font-weight="500" fill="#203e3b">确认收到，列出缺项</text>
<text x="512" y="191" text-anchor="middle" font-size="19" font-weight="550" fill="#37665a">确认范围，补充信息</text>
<text x="512" y="254" text-anchor="middle" font-size="19" font-weight="500" fill="#203e3b">初审结论与审核安排</text>
<text x="766" y="191" text-anchor="middle" font-size="19" font-weight="550" fill="#37665a">数据、代码与运行记录</text>
<text x="766" y="254" text-anchor="middle" font-size="19" font-weight="500" fill="#203e3b">专业审核与独立复现</text>
<text x="1020" y="191" text-anchor="middle" font-size="19" font-weight="550" fill="#37665a">逐项回复，更新版本</text>
<text x="1020" y="254" text-anchor="middle" font-size="19" font-weight="500" fill="#203e3b">核对修改，记录结论</text>
<text x="1274" y="191" text-anchor="middle" font-size="19" font-weight="550" fill="#37665a">确认署名与维护人</text>
<text x="1274" y="254" text-anchor="middle" font-size="19" font-weight="500" fill="#203e3b">收录决定与发布</text>
</g>
</svg>
