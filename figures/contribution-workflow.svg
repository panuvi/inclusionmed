<title id="workflow-title">InclusionMed · Contribution workflow</title>
<desc id="workflow-desc">Two steps: share your contribution through the online form, then develop it together by email. Contributors submit and refine their work. Organizers review, follow up and confirm the outcome before publication or collaboration.</desc>
